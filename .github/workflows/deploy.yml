# ═══════════════════════════════════════════════════════════
# AUTO DEPLOY → Firebase Hosting + Cloud Functions + Rules
# ───────────────────────────────────────────────────────────
# PC ki zaroorat NAHI. GitHub Actions khud build + deploy karega.
# ═══════════════════════════════════════════════════════════

name: Deploy to Firebase

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'

  workflow_dispatch:
    inputs:
      skip_typecheck:
        description: 'TypeScript check skip karein? (urgent deploy ke liye)'
        type: boolean
        default: false

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        if: ${{ !inputs.skip_typecheck }}
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        env:
          VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:         ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:          ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:      ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY:           ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_SUBSCRIPTION_ENABLED: 'true'
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html nahi bana"
            exit 1
          fi
          echo "✅ Build ready"

      - name: Deploy Cloud Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
          GCLOUD_PROJECT: training-command-erp
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install --prefix functions
          npx --yes -p firebase-tools@13 firebase deploy --only functions --project training-command-erp --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Deploy Storage Rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes -p firebase-tools@13 firebase deploy --only storage --project training-command-erp --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Deploy Firestore Rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes -p firebase-tools@13 firebase deploy --only firestore:rules --project training-command-erp --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: training-command-erp
          channelId: live

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## 🚀 Deploy ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Live URL** | https://training-command-erp.web.app |"
            echo "| **Functions** | 4 (staff + backup) |"
            echo "| **Storage Rules** | ✅ |"
            echo "| **Firestore Rules** | ✅ |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
          } >> $GITHUB_STEP_SUMMARY
