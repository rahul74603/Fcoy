# ═══════════════════════════════════════════════════════════
# PR PREVIEW — live site ko chhue bina test karo
# ───────────────────────────────────────────────────────────
# Jab bhi Pull Request banega, ye ek ALAG temporary URL par
# deploy karega. Bot us URL ko PR me comment kar dega.
#
# Faayda: bada change (jaise naya module) pehle preview me
# dekh lo, sab theek lage tabhi merge karo. Live site
# tab tak safe rehti hai.
#
# Preview URL 7 din baad apne aap khatam ho jaata hai.
# ═══════════════════════════════════════════════════════════

name: PR Preview

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  checks: write
  contents: read
  pull-requests: write      # bot ko comment karne ke liye

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-preview:
    name: Build & Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Fork se aaye PR par mat chalao — wahan secrets nahi milte
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        env:
          VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:         ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:          ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:      ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID }}

          VITE_GROQ_API_KEY:    ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_GROQ_API_KEY_2:  ${{ secrets.VITE_GROQ_API_KEY_2 }}
          VITE_GROQ_API_KEY_3:  ${{ secrets.VITE_GROQ_API_KEY_3 }}
          VITE_GROQ_MODEL:      ${{ secrets.VITE_GROQ_MODEL }}

          VITE_GEMINI_API_KEY:   ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY_2: ${{ secrets.VITE_GEMINI_API_KEY_2 }}
          VITE_GEMINI_MODEL:     ${{ secrets.VITE_GEMINI_MODEL }}

          VITE_PINECONE_API_KEY: ${{ secrets.VITE_PINECONE_API_KEY }}
          VITE_PINECONE_HOST:    ${{ secrets.VITE_PINECONE_HOST }}

          VITE_AI_ENABLE_LOCAL_ERP: ${{ vars.VITE_AI_ENABLE_LOCAL_ERP || 'true' }}
          VITE_AI_ENABLE_CACHE:     ${{ vars.VITE_AI_ENABLE_CACHE     || 'true' }}
          VITE_AI_ENABLE_GROQ:      ${{ vars.VITE_AI_ENABLE_GROQ      || 'true' }}
          VITE_AI_ENABLE_GEMINI:    ${{ vars.VITE_AI_ENABLE_GEMINI    || 'true' }}
          VITE_AI_ENABLE_PINECONE:  ${{ vars.VITE_AI_ENABLE_PINECONE  || 'false' }}
        run: npm run build

      # channelId nahi diya → apne aap temporary preview channel banta hai
      - name: Deploy preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: training-command-erp
          expires: 7d
